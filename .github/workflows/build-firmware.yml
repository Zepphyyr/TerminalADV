name: build-firmware

# Builds the KODZIMIM prologue firmware for M5Stack Cardputer-Adv in the cloud
# and publishes the .bin files as downloadable artifacts. No local toolchain
# needed: push to GitHub (or use "Run workflow"), then grab the artifact.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO + esptool
        run: pip install -U platformio "esptool<5"   # v5 renamed merge_bin -> merge-bin

      - name: Regenerate embedded story texts
        run: python tools/gen_content.py

      - name: Build firmware (.bin)
        run: pio run

      - name: Make single-file merged .bin (flash to 0x0)
        run: |
          set -e
          D=.pio/build/cardputer-adv
          ARGS="0x0 $D/bootloader.bin 0x8000 $D/partitions.bin 0x10000 $D/firmware.bin"
          BOOTAPP=$(find "$HOME/.platformio" -name boot_app0.bin 2>/dev/null | head -1)
          if [ -n "$BOOTAPP" ]; then ARGS="$ARGS 0xe000 $BOOTAPP"; fi
          # esptool <5 uses merge_bin/--flash_mode; v5+ uses merge-bin/--flash-mode
          python -m esptool --chip esp32s3 merge_bin \
            -o kodzimim_prologue_merged.bin \
            --flash_mode dio --flash_size 8MB $ARGS \
          || python -m esptool --chip esp32s3 merge-bin \
            -o kodzimim_prologue_merged.bin \
            --flash-mode dio --flash-size 8MB $ARGS
          ls -l kodzimim_prologue_merged.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kodzimim-firmware
          path: |
            .pio/build/cardputer-adv/firmware.bin
            .pio/build/cardputer-adv/bootloader.bin
            .pio/build/cardputer-adv/partitions.bin
            kodzimim_prologue_merged.bin
