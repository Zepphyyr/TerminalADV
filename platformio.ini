; PlatformIO project for KODZIMIM on M5Stack Cardputer-Adv (ESP32-S3).
; Self-contained: story texts are baked into the firmware (content_embedded.h),
; so there is a SINGLE .bin and no separate filesystem upload.
;
;   Build:         pio run
;   Build + flash: pio run -t upload
;   The .bin lands at: .pio/build/cardputer-adv/firmware.bin
;
; See BUILD_DEVICE.md for the full step-by-step.

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3          ; StampS3/S3A core; adjust if PIO adds an ADV id
framework = arduino
monitor_speed = 115200

lib_deps =
    m5stack/M5Cardputer
    m5stack/M5Unified

; Regenerate content_embedded.h from content/prologue/*.txt before every build,
; so the firmware texts can never drift out of sync with the .txt files.
extra_scripts = pre:tools/gen_content.py

; Compile only the ESP32 frontend + the shared core (skip the desktop files).
build_src_filter = +<esp32/> +<core/> -<desktop/>
build_flags = -std=gnu++17
