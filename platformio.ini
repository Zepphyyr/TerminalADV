; PlatformIO project for KODZIMIM on M5Stack Cardputer-Adv (ESP32-S3).
; Self-contained: story texts are baked into the firmware (content_embedded.h),
; so there is a SINGLE .bin and no separate filesystem upload.
;
;   Build:         pio run
;   Build + flash: pio run -t upload
;   The .bin lands at: .pio/build/cardputer-adv/firmware.bin
;
; See BUILD_DEVICE.md for the full step-by-step.

[env:cardputer-adv]
; Pinned on purpose. Unpinned, CI pulls the newest platform, which today means
; Arduino Core 3.x / ESP-IDF 5.x — those app images differ in header layout from
; the Core 2.x images the whole M5 ecosystem (M5Launcher included) is built on.
; 6.9.0 == Arduino Core 2.0.17. Do not bump without re-testing a Launcher install.
platform = espressif32@6.9.0
board = m5stack-stamps3          ; StampS3A = ESP32-S3FN8, 8MB flash, no PSRAM
framework = arduino
monitor_speed = 115200

lib_deps =
    m5stack/M5Cardputer
    m5stack/M5Unified

; Regenerate content_embedded.h from content/prologue/*.txt before every build,
; so the firmware texts can never drift out of sync with the .txt files.
extra_scripts = pre:tools/gen_content.py

; Compile only the ESP32 frontend + the shared core (skip the desktop files).
build_src_filter = +<esp32/> +<core/> -<desktop/>
; The Arduino ESP32 core injects -std=gnu++11; unflag it so ours applies.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; ---------------------------------------------------------------------------
; Diagnostic environment. Builds a near-empty app with the SAME platform, board
; and framework as the game, so we can tell a bad build configuration apart from
; a bad application binary when M5Launcher refuses an install.
;   pio run -e probe   ->  .pio/build/probe/firmware.bin
; ---------------------------------------------------------------------------
[env:probe]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps = m5stack/M5Unified
build_src_filter = +<probe/> -<core/> -<esp32/> -<desktop/>
